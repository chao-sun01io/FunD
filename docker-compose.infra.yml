# Hybrid dev workflow: start only Redis locally.
# Django + Celery worker + Beat run as host processes via honcho (see backend/Procfile).
# Database defaults to SQLite (USE_POSTGRES=False in backend/.env).
#
# Usage:
#   docker-compose -f docker-compose.infra.yml up -d
#   cd backend && uv run honcho start
#   docker-compose -f docker-compose.infra.yml down

services:
  redis:
    image: redis:latest
    ports:
      - 6380:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
